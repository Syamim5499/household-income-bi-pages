name: Refresh DOSM survey data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 1 * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build JSON from official CSVs
        run: python3 scripts/build_data.py
      - name: Commit only source data changes
        run: |
          git add data/income.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Refresh DOSM income data'
          git push
